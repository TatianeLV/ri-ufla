<ds-results-back-button *ngIf="showBackButton$ | async" [back]="back"></ds-results-back-button>

<div class="row" *ngIf="iiifEnabled">
  <div class="col-12">
    <ds-mirador-viewer id="iiif-viewer"
                   [object]="object"
                   [searchable]="iiifSearchEnabled"
                   [query]="iiifQuery$ | async">
    </ds-mirador-viewer>
  </div>
</div>

<ds-generic-item-page-field [item]="object" [fields]="['dc.type']"></ds-generic-item-page-field>

<div class="d-flex flex-row">
  <ds-item-page-title-field [item]="object" class="mr-auto">
  </ds-item-page-title-field>
  <ds-dso-edit-menu></ds-dso-edit-menu>
</div>

<div class="row">

  <div class="col-xs-12 col-md-4">
    <ng-container *ngIf="!(mediaViewer.image || mediaViewer.video)">
      <ds-metadata-field-wrapper [hideIfNoTextContent]="false">
        <ds-thumbnail [thumbnail]="object?.thumbnail | async"></ds-thumbnail>
      </ds-metadata-field-wrapper>
    </ng-container>
    <div *ngIf="mediaViewer.image || mediaViewer.video" class="mb-2">
      <ds-media-viewer [item]="object"></ds-media-viewer>
    </div>
    <!-- Arquivos -->
    <ds-item-page-file-section [item]="object"></ds-item-page-file-section>
    <!-- Notas -->
    <ds-generic-item-page-field [item]="object"
     [fields]="['dc.description.notes']"
     label="Notas">
    </ds-generic-item-page-field>
    <!-- Data -->
    <ds-item-page-date-field [item]="object"></ds-item-page-date-field>

    <ds-metadata-representation-list class="ds-item-page-mixed-author-field riufla-person-identifiers"
      [parentItem]="object"
      [itemType]="'Person'"
      [metadataFields]="['dc.contributor.author', 'dc.creator']"
      [label]="'relationships.isAuthorOf' | translate">
    </ds-metadata-representation-list>

    <!-- Identificadores dos Autores -->
<div
*ngIf="object?.metadata?.['dc.creator.Lattes']?.[0]?.value ||
       object?.metadata?.['dc.creator.orcid']?.[0]?.value"
class="mb-3">

<!-- Currículo Lattes -->
<ng-container
  *ngIf="object?.metadata?.['dc.creator.Lattes']?.[0]?.value as lattes">
  <div class="small mb-1">
    Lattes:
    <a
      [href]="lattes.startsWith('http://') || lattes.startsWith('https://')
        ? lattes
        : 'http://lattes.cnpq.br/' + lattes"
      target="_blank"
      rel="noopener noreferrer"
      title="Acessar currículo Lattes">
      {{ lattes }}
    </a>
  </div>
</ng-container>

<!-- ORCID -->
<ng-container
  *ngIf="object?.metadata?.['dc.creator.orcid']?.[0]?.value as orcid">
  <div class="small mb-1">
    ORCID:
    <a
      [href]="orcid.startsWith('http://') || orcid.startsWith('https://')
        ? orcid
        : 'https://orcid.org/' + orcid"
      target="_blank"
      rel="noopener noreferrer"
      title="Acessar ORCID">
      {{ orcid }}
    </a>
  </div>
</ng-container>

</div>
